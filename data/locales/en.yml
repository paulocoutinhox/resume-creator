open_source_projects:
  - title: "Haylen"
    description: >-
      My engine for games, multimedia apps and applications: a C++20 core with
      its whole API in Lua, where one app package runs on macOS, Windows, Linux,
      iOS, Android, tvOS, visionOS and the web.
    bullets:
      - "2D rendering, animation, physics, tiled maps, UI, text, audio, input and networking."
      - "Metal, Direct3D, Vulkan, OpenGL and WebGPU back-ends."
      - "Native plugins in Swift, Kotlin, Java, JavaScript and C++ behind one Lua API."
      - "One CLI that creates, runs, tests and packages apps."
    url: "https://github.com/haylen-org/haylen"
    start: { year: 2026, month: 9 }
    end: null

  - title: "Varn"
    description: >-
      Lua runtime with a C++ core for writing back-ends, tools and apps once and
      running the same code on Linux, macOS, Windows, iOS, Android and the
      browser. HTTP and WebSocket servers, async tasks, files, crypto and
      packaging come built in, so a project needs no extra libraries, and it
      serves about 2.5× more requests per core than Node.js and Python.
    url: "https://github.com/varn-org/varn"
    start: { year: 2026, month: 9 }
    end: null

  - title: "IonClaw"
    description: >-
      Cross-platform AI agent orchestrator in C++ that turns any device,
      including a phone, into a self-contained multi-agent automation platform.
    url: "https://github.com/ionclaw-org/ionclaw"
    start: { year: 2026, month: 3 }
    end: null

  - title: "PDFium Library"
    description: >-
      Ready-to-use builds of Google's PDFium for iOS, Android, macOS, Linux,
      Windows and WebAssembly, so apps can render PDFs without setting up
      Chromium's build toolchain. 1,000+ GitHub stars.
    url: "https://github.com/paulocoutinhox/pdfium-lib"
    start: { year: 2018, month: 5 }
    end: null

  - title: "XPLPC"
    description: >-
      Cross Platform Lite Procedure Call: calls shared C++ code from Swift,
      Kotlin, Flutter, Python and WebAssembly on mobile, desktop and the web.
    url: "https://github.com/xplpc/xplpc"
    start: { year: 2023, month: 1 }
    end: null

  - title: "Nativium"
    description: >-
      C++ project template for writing a library once and compiling it for
      iOS, Android, desktop and WebAssembly, with the build, dependencies and
      mobile bindings already set up. It is the base of the Ubook Mobile SDK.
    url: "https://github.com/nativium/nativium"
    start: { year: 2022, month: 5 }
    end: null

  - title: "FastKit"
    description: >-
      Multi-tenant public site, admin panel and API built on FastAPI and served
      by one process, with accounts, subscriptions, payments (Stripe,
      RevenueCat) and content built in.
    url: "https://github.com/paulocoutinhox/fastkit"
    start: { year: 2026, month: 8 }
    end: null

  - title: "Kaktos"
    description: "Python static site generator built for serverless deployment workflows."
    url: "https://github.com/paulocoutinhox/kaktos"
    start: { year: 2021, month: 10 }
    end: null
