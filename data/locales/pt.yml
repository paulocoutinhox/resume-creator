open_source_projects:
  - title: "Haylen"
    description: >-
      Minha engine para games, apps multimídia e aplicativos: núcleo em C++20
      com toda a API em Lua, onde um único pacote de app roda em macOS,
      Windows, Linux, iOS, Android, tvOS, visionOS e web.
    bullets:
      - "Renderização 2D, animação, física, mapas tiled, UI, texto, áudio, input e rede."
      - "Back-ends Metal, Direct3D, Vulkan, OpenGL e WebGPU."
      - "Plugins nativos em Swift, Kotlin, Java, JavaScript e C++ sob uma única API Lua."
      - "Uma CLI que cria, executa, testa e empacota apps."
    url: "https://github.com/haylen-org/haylen"
    start: { year: 2026, month: 9 }
    end: null

  - title: "Varn"
    description: >-
      Runtime Lua com núcleo em C++ para escrever back-ends, ferramentas e apps
      uma única vez e rodar o mesmo código em Linux, macOS, Windows, iOS,
      Android e no navegador. Servidor HTTP e WebSocket, tarefas assíncronas,
      arquivos, criptografia e empacotamento já vêm prontos, sem bibliotecas
      extras, e ele atende cerca de 2,5× mais requisições por núcleo que
      Node.js e Python.
    url: "https://github.com/varn-org/varn"
    start: { year: 2026, month: 9 }
    end: null

  - title: "IonClaw"
    description: >-
      Orquestrador de agentes de IA multiplataforma em C++ que transforma
      qualquer dispositivo, inclusive o celular, em uma plataforma
      independente de automação com múltiplos agentes.
    url: "https://github.com/ionclaw-org/ionclaw"
    start: { year: 2026, month: 3 }
    end: null

  - title: "PDFium Library"
    description: >-
      Builds prontos do PDFium do Google para iOS, Android, macOS, Linux,
      Windows e WebAssembly, para que apps exibam PDFs sem precisar montar o
      ambiente de build do Chromium. Mais de 1.000 estrelas no GitHub.
    url: "https://github.com/paulocoutinhox/pdfium-lib"
    start: { year: 2018, month: 5 }
    end: null

  - title: "XPLPC"
    description: >-
      Cross Platform Lite Procedure Call: chama código C++ compartilhado a
      partir de Swift, Kotlin, Flutter, Python e WebAssembly no mobile, desktop
      e web.
    url: "https://github.com/xplpc/xplpc"
    start: { year: 2023, month: 1 }
    end: null

  - title: "Nativium"
    description: >-
      Template de projeto C++ para escrever uma biblioteca uma vez e compilar
      para iOS, Android, desktop e WebAssembly, com build, dependências e
      integração com o mobile já prontos. É a base do Ubook Mobile SDK.
    url: "https://github.com/nativium/nativium"
    start: { year: 2022, month: 5 }
    end: null

  - title: "FastKit"
    description: >-
      Site público multi-tenant, painel administrativo e API feitos em FastAPI
      e servidos por um único processo, com contas, assinaturas, pagamentos
      (Stripe, RevenueCat) e conteúdo integrados.
    url: "https://github.com/paulocoutinhox/fastkit"
    start: { year: 2026, month: 8 }
    end: null

  - title: "Kaktos"
    description: "Gerador de sites estáticos em Python pensado para fluxos de deploy serverless."
    url: "https://github.com/paulocoutinhox/kaktos"
    start: { year: 2021, month: 10 }
    end: null
