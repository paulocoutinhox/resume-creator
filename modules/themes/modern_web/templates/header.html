{% set profile = resume.profile %}
<header class="sticky top-0 z-40 border-b border-slate-200/80 bg-white/90 backdrop-blur-md">
    <nav class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-4 px-4 py-3">
        <a href="#top" class="group flex min-w-0 items-center gap-2.5 rounded-md focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2">
            {% if photo_uri %}
                <img src="{{ photo_uri }}" alt="{{ profile.name }}" width="36" height="36"
                     class="h-9 w-9 shrink-0 rounded-full object-cover ring-2 ring-white transition group-hover:opacity-90">
            {% endif %}
            <span class="min-w-0 truncate text-sm font-semibold tracking-tight text-slate-800">{{ profile.name }}</span>
        </a>

        <div class="flex items-center gap-1">
            <div class="hidden items-center gap-1 sm:flex">
                {% for link in resume.social %}
                    <a href="{{ link.url }}" rel="me noopener noreferrer" target="_blank" aria-label="{{ link.network.value }}"
                       class="rounded-md p-2 text-slate-500 transition hover:bg-slate-100 hover:text-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">
                        {{ icon(social_icon_key(link.network), 'h-5 w-5 stroke-current') | safe }}
                    </a>
                {% endfor %}
            </div>

            <span class="mx-1 hidden h-5 w-px bg-slate-200 sm:block" aria-hidden="true"></span>

            <ul class="flex items-center gap-1">
                {% for lang in site.languages %}
                    <li>
                        <a href="../{{ lang.value }}/index.html"
                           class="rounded-lg px-2.5 py-1.5 text-xs font-semibold uppercase tracking-wider transition
                                  {% if lang == locale %}bg-slate-900 text-white shadow-sm{% else %}text-slate-600 hover:bg-slate-100 hover:text-slate-900{% endif %}">
                            {{ lang.value }}
                        </a>
                    </li>
                {% endfor %}
            </ul>
        </div>
    </nav>
</header>
